name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Databricks bundle validation is disabled while this project uses Databricks
  # Free Edition. Free Edition cannot configure the account-level service
  # principal federation policy required by GitHub OIDC. Restore this job when
  # moving to a Databricks trial or paid account.
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather_retail_lakehouse
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --group dev --no-install-project

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      # Databricks Connect tests are disabled for the same reason as bundle
      # validation above: they require GitHub OIDC authentication.
