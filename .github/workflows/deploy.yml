name: Deploy Databricks Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Databricks bundle target to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      run_after_deploy:
        description: Run a bundle job or pipeline after deployment
        required: true
        default: false
        type: boolean
      resource_to_run:
        description: Optional bundle resource key, for example wf_bronze_landing_weather_api
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }}
  cancel-in-progress: false

jobs:
  # The Databricks deployment commands are intentionally disabled while this
  # project uses Databricks Free Edition. Free Edition does not provide the
  # account-level federation policy required by GitHub OIDC.
  deployment-disabled:
    name: Databricks deployment disabled for Free Edition
    runs-on: ubuntu-latest
    steps:
      - name: Explain why deployment is disabled
        run: |
          echo "Databricks bundle deployment is disabled for Databricks Free Edition."
          echo "Deploy manually from the Databricks workspace."
          echo "Restore the GitHub OIDC commands after moving to a trial or paid account."
