[project]
name = "weather_retail_lakehouse"
version = "0.0.1"
authors = [{ name = "manikumarkotipalli1234@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "weather_retail_lakehouse.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"weather_retail_lakehouse_databricks/src/notebooks/**/*.py" = [
    "BLE001", # Databricks ingestion notebooks often log row-level failures and continue.
    "F401",   # Notebook-style files can keep imports for interactive development.
    "F821",   # Databricks injects spark/dbutils globals at runtime.
    "I001",   # Preserve notebook cell/import ordering.
]
