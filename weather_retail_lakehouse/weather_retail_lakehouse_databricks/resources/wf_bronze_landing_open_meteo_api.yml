resources:
  jobs:
    wf_bronze_landing_weather_api:
      name: wf_bronze_landing_weather_api

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # 6 AM daily
        timezone_id: "UTC"
        pause_status: UNPAUSED

      tasks:
        - task_key: bronze_landing_weather_api
          spark_python_task:
            python_file: ../src/notebooks/bronze_landing_open_meteo_api.py
          environment_key: default

        #- task_key: silver_weather_forecast_daily
        #  depends_on:
        #    - task_key: bronze_landing_weather_api
        #  spark_python_task:
        #    python_file: ../src/notebooks/silver_weather_forecast_daily.py
        #  environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - requests